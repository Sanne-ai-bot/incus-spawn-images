name: Build Fedora Base Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. fedora-44-v2)'
        required: false
        default: ''
  schedule:
    # Rebuild roughly every 10 days for security updates (1st, 11th, 21st at 03:17 UTC)
    - cron: '17 3 1,11,21 * *'
  push:
    branches: [main]
    paths:
      - 'fedora/**'
      - 'tests/test-container-boot.sh'
      - '.github/workflows/build-fedora.yml'
      - '.github/workflows/build-vm-scratch.yml'

env:
  RELEASE: '44'

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Build container image
        run: |
          mkdir -p output
          podman run --rm --privileged \
            -v "${{ github.workspace }}:/build:ro" \
            -v "${{ github.workspace }}/output:/output" \
            -e OUTPUT_DIR=/output \
            fedora:${{ env.RELEASE }} \
            bash /build/fedora/build.sh

      - name: Boot the container image
        run: tests/test-container-boot.sh output/fedora-${{ env.RELEASE }}-${{ matrix.arch }}.tar.xz

      - name: Install VM build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils jq curl cloud-guest-utils e2fsprogs

      - name: Build VM image
        run: |
          sudo fedora/build-vm.sh output

      - name: Upload container artifact
        uses: actions/upload-artifact@v7
        with:
          name: fedora-${{ env.RELEASE }}-${{ matrix.arch }}
          path: |
            output/fedora-${{ env.RELEASE }}-${{ matrix.arch }}.tar.xz
            output/fedora-${{ env.RELEASE }}-${{ matrix.arch }}.tar.xz.sha256

      - name: Upload VM artifact
        uses: actions/upload-artifact@v7
        with:
          name: fedora-${{ env.RELEASE }}-${{ matrix.arch }}-vm
          path: |
            output/fedora-${{ env.RELEASE }}-${{ matrix.arch }}-vm.tar.xz
            output/fedora-${{ env.RELEASE }}-${{ matrix.arch }}-vm.tar.xz.sha256

  # The VM image built from scratch, with its boot test as the gate: released as
  # -vm-direct.tar.xz beside the stock-based -vm.tar.xz above, never in place of it.
  build-vm-direct:
    uses: ./.github/workflows/build-vm-scratch.yml

  release:
    needs: [build, build-vm-direct]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp artifacts/fedora-${{ env.RELEASE }}-x86_64/* release/
          cp artifacts/fedora-${{ env.RELEASE }}-aarch64/* release/
          cp artifacts/fedora-${{ env.RELEASE }}-x86_64-vm/* release/
          cp artifacts/fedora-${{ env.RELEASE }}-aarch64-vm/* release/

          # Create combined SHA256SUMS
          cd release
          for f in *.sha256; do
            basename="${f%.sha256}"
            echo "$(cat "$f")  ${basename}" >> SHA256SUMS
          done
          cat SHA256SUMS

          # Everything below leaves SHA256SUMS and the four assets above as they were:
          # isx releases before the v2 reader file any name containing -vm in
          # SHA256SUMS as the VM image, so the image built from scratch is listed
          # only in SHA256SUMS.v2, which lists all six.
          cp SHA256SUMS SHA256SUMS.v2
          for arch in x86_64 aarch64; do
            src="../artifacts/fedora-${{ env.RELEASE }}-${arch}-vm-scratch/fedora-${{ env.RELEASE }}-${arch}-vm-scratch.tar.xz"
            cp "$src" "fedora-${{ env.RELEASE }}-${arch}-vm-direct.tar.xz"
            echo "$(cat "$src.sha256")  fedora-${{ env.RELEASE }}-${arch}-vm-direct.tar.xz" >> SHA256SUMS.v2
          done
          cat SHA256SUMS.v2
          # Every listed checksum is that of the file published under its name.
          sha256sum --strict -c SHA256SUMS.v2
          [ "$(wc -l < SHA256SUMS)" = 4 ] && [ "$(wc -l < SHA256SUMS.v2)" = 6 ] \
            || { echo "SHA256SUMS must list 4 assets and SHA256SUMS.v2 6"; exit 1; }
          if grep -q -- '-vm-direct' SHA256SUMS; then echo "SHA256SUMS lists -vm-direct"; exit 1; fi

      - name: Determine version tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=fedora-${{ env.RELEASE }}-$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Fedora ${{ env.RELEASE }} Base Image (${{ steps.version.outputs.tag }})
          body: |
            Fedora ${{ env.RELEASE }} base image for incus-spawn.

            Pre-baked with: agentuser, base packages, systemd service masks, resolved disabled.

            **Container image** (`.tar.xz`): rootfs tarball for Incus containers.
            **VM image** (`-vm-direct.tar.xz`): disk image for Incus VMs, built from scratch around incus-spawn's own kernel, which the firmware starts directly: no boot loader, no initrd, no modules. It needs the root disk on virtio-blk and Secure Boot off, both of which isx sets from the release that reads `SHA256SUMS.v2` on. Listed only in `SHA256SUMS.v2`.

            **Legacy VM image** (`-vm.tar.xz`): disk image built from the stock Incus Fedora image, for isx releases that read only `SHA256SUMS`. Unchanged, and listed in `SHA256SUMS` as before.

            **Checksums:** `SHA256SUMS` lists the container and legacy VM images, exactly as before; `SHA256SUMS.v2` lists all six assets.

            **Usage:** isx tracks the newest release by itself; the automated bump in `incus-spawn` updates the built-in fallback in `minimal.yaml`.
          files: |
            release/fedora-${{ env.RELEASE }}-x86_64.tar.xz
            release/fedora-${{ env.RELEASE }}-aarch64.tar.xz
            release/fedora-${{ env.RELEASE }}-x86_64-vm.tar.xz
            release/fedora-${{ env.RELEASE }}-aarch64-vm.tar.xz
            release/fedora-${{ env.RELEASE }}-x86_64-vm-direct.tar.xz
            release/fedora-${{ env.RELEASE }}-aarch64-vm-direct.tar.xz
            release/SHA256SUMS
            release/SHA256SUMS.v2

      # Push model: tell incus-spawn a new base image is available, carrying the tag
      # and checksums we just computed so it doesn't have to poll or re-parse them.
      # Requires a repo secret INCUS_SPAWN_DISPATCH_TOKEN — a token with write access
      # to Sanne/incus-spawn (the default GITHUB_TOKEN is scoped to this repo only and
      # cannot dispatch cross-repo). Missing token → the notification is skipped, not
      # a release failure.
      - name: Notify incus-spawn of new base image
        env:
          DISPATCH_TOKEN: ${{ secrets.INCUS_SPAWN_DISPATCH_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "${DISPATCH_TOKEN:-}" ]]; then
            echo "INCUS_SPAWN_DISPATCH_TOKEN not set; skipping cross-repo notification."
            exit 0
          fi

          sha_for() { awk -v f="$1" '$2 == f { print $1 }' release/SHA256SUMS.v2; }
          C_X86="$(sha_for "fedora-${RELEASE}-x86_64.tar.xz")"
          C_ARM="$(sha_for "fedora-${RELEASE}-aarch64.tar.xz")"
          V_X86="$(sha_for "fedora-${RELEASE}-x86_64-vm.tar.xz")"
          V_ARM="$(sha_for "fedora-${RELEASE}-aarch64-vm.tar.xz")"
          D_X86="$(sha_for "fedora-${RELEASE}-x86_64-vm-direct.tar.xz")"
          D_ARM="$(sha_for "fedora-${RELEASE}-aarch64-vm-direct.tar.xz")"

          for pair in "tag:$TAG" \
                      "container/x86_64:$C_X86" "container/aarch64:$C_ARM" \
                      "vm/x86_64:$V_X86" "vm/aarch64:$V_ARM" \
                      "vm_direct/x86_64:$D_X86" "vm_direct/aarch64:$D_ARM"; do
            val="${pair#*:}"
            if [[ -z "$val" ]]; then
              echo "Missing ${pair%%:*}; not notifying incus-spawn." >&2
              exit 1
            fi
          done

          payload="$(jq -n \
            --arg tag "$TAG" \
            --arg cx "$C_X86" --arg ca "$C_ARM" \
            --arg vx "$V_X86" --arg va "$V_ARM" \
            --arg dx "$D_X86" --arg da "$D_ARM" \
            '{event_type: "base-image-released",
              client_payload: {
                tag: $tag,
                sha256: {
                  container: {x86_64: $cx, aarch64: $ca},
                  vm: {x86_64: $vx, aarch64: $va},
                  vm_direct: {x86_64: $dx, aarch64: $da}
                }
              }}')"

          GH_TOKEN="$DISPATCH_TOKEN" gh api \
            --method POST \
            repos/Sanne/incus-spawn/dispatches \
            --input - <<<"$payload"
          echo "Notified Sanne/incus-spawn of base-image-released $TAG"
