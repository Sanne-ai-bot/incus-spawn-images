name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Network watchdog
        run: tests/test-network-watchdog.sh
        env:
          # The runner has iproute2 and a loopback address: fail rather than skip
          # the checks against the real `ip`.
          REQUIRE_REAL_IP: 1

      - name: VM kernel command line
        run: tests/test-kernel-cmdline.sh

      - name: VM boot entries
        run: tests/test-boot-entries.sh

      - name: VM stale boot entries
        run: tests/test-stale-boot-entries.sh

      - name: ISX_REF bump
        run: tests/test-update-isx-ref.sh
