# incus-spawn: the kernel is the image's, not a package's.
#
# This VM image boots a kernel built with the image (incus-spawn's
# appliance/kernel, `build-kernel.sh vm`): no modules, no initrd, started by the
# firmware straight from the EFI partition. A Fedora kernel package would put a
# kernel in /boot that nothing boots, plus about 100 MB of modules nothing loads,
# so dnf is told not to install one; `dnf install kernel-core` then reports that
# the argument "matches only excluded packages". Kernel updates arrive with an
# image rebuild.
#
# Only the packages that carry a kernel or its modules, the debug flavour's
# included: kernel-headers (needed by glibc-devel) and kernel-devel stay
# installable.
#
# To lift it for one command: dnf --setopt=excludepkgs= install ...
# For good, in this box: delete this file. Neither makes the box boot that
# kernel; for kernel work, boot it in a nested VM inside a --kvm branch
# (virtme-ng, or QEMU with -kernel).
[main]
excludepkgs=kernel,kernel-core,kernel-modules,kernel-modules-core,kernel-modules-extra,kernel-modules-internal,kernel-uki-virt,kernel-uki-virt-addons,kernel-debug,kernel-debug-core,kernel-debug-modules,kernel-debug-modules-core,kernel-debug-modules-extra,kernel-debug-modules-internal,kernel-debug-uki-virt
